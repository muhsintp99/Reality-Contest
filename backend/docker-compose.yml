version: "3.8"

services:

  # ============================================================
  # REDIS
  # ============================================================
  # Used by PM2 backend.
  #
  # PM2 Backend:
  #   REDIS_URL=redis://127.0.0.1:6379
  #
  # Redis is accessible only from this VPS.
  # It is NOT exposed to the public internet.
  # ============================================================

  redis:
    image: redis:7-alpine
    container_name: haka_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

# ============================================================
# VOLUMES
# ============================================================

volumes:

  redis_data:
    driver: local
