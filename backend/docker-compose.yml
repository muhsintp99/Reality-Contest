version: "3.8"

services:

  # ============================================================
  # REDIS
  # ============================================================
  # Production:
  # PM2 Backend -> 127.0.0.1:6379 -> Docker Redis
  #
  # Local:
  # Local Backend -> 127.0.0.1:6379 -> Docker Redis
  #
  # Redis is exposed ONLY on VPS/local host.
  # It is NOT directly exposed to the internet.
  # ============================================================

  redis:
    image: redis:7-alpine
    container_name: haka_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - haka_network

  # ============================================================
  # MONGODB
  # ============================================================
  # LOCAL DEVELOPMENT ONLY
  #
  # Production backend uses MongoDB Atlas:
  # MONGODB_URI=mongodb+srv://...
  #
  # Therefore MongoDB Docker container is NOT required
  # on production VPS.
  # ============================================================

  mongodb:
    image: mongo:6
    container_name: haka_mongodb
    restart: unless-stopped

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongo_data:/data/db

    networks:
      - haka_network

# ============================================================
# VOLUMES
# ============================================================

volumes:

  redis_data:
    driver: local

  mongo_data:
    driver: local

# ============================================================
# NETWORK
# ============================================================

networks:

  haka_network:
    driver: bridge
