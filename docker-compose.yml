version: "3.8"

services:

  # ============================================================
  # REDIS
  # ============================================================
  # Production:
  # PM2 Backend -> 127.0.0.1:6379 -> Docker Redis
  #
  # Local:
  # Local Backend -> 127.0.0.1:6379 -> Docker Redis
  #
  # Redis is bound only to localhost.
  # It is NOT publicly accessible from the internet.
  # ============================================================

  redis:
    image: redis:7-alpine
    container_name: haka_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

  # ============================================================
  # MONGODB
  # ============================================================
  # LOCAL DEVELOPMENT ONLY
  #
  # Production:
  # Backend uses MongoDB Atlas through backend/.env
  #
  # MONGODB_URI=mongodb+srv://...
  #
  # This container is available for local development.
  # ============================================================

  mongodb:
    image: mongo:6
    container_name: haka_mongodb
    restart: unless-stopped

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongo_data:/data/db

# ============================================================
# VOLUMES
# ============================================================

volumes:

  redis_data:
    driver: local

  mongo_data:
    driver: local
