# 1. Backend API Domain (api.hakalive.in)
server {
    listen 80;
    server_name api.hakalive.in;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:10000;
        # proxy_pass http://backend:10000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Admin Dashboard Domain (dashboard.hakalive.in & Localhost Port 10002)
server {
    listen 80;
    listen 10002;
    server_name dashboard.hakalive.in localhost 127.0.0.1;

    client_max_body_size 100M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for API calls
    location /api/ {
        proxy_pass http://127.0.0.1:10000/api/;
        # proxy_pass http://backend:10000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    # Direct media uploads access
    location /uploads/ {
        proxy_pass http://backend:10000/uploads/;
        client_max_body_size 100M;
    }

    # Swagger API Docs
    location /api-docs {
        proxy_pass http://backend:10000/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 100M;
    }
}

# 3. Main Public Web App Domain (hakalive.in & www.hakalive.in)
server {
    listen 80;
    server_name hakalive.in www.hakalive.in;

    client_max_body_size 100M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:10000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
